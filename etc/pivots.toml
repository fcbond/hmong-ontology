# Wordnet releases this repository links against, and the only place their
# versions are declared.
#
# Triangulation counts languages, so a pivot wordnet at a different release can
# change which ILI wins a vote --- not merely how many senses link. The releases
# are therefore pinned, `load_pivots.py` resolves these URLs into
# `etc/pivots.lock`, and the converter refuses any other version.
#
# This file is deliberately separate from `etc/wordnets.toml`, which lists what the
# browsable lookup merges (English and the two Hmong lexicons, nothing else). These
# 28 pivots are queried while building the wordnet and are not part of it.
#
# The format is Cygnet's, so the URLs can be kept in step with it by eye; the
# version in each filename is what `load_pivots.py` pins. Keeping our own copy
# means a build here does not depend on the state of a sibling checkout.
#
# English is the backbone every linking route goes through. The "plus" edition
# carries curated proper names from Open English Namenet, among them Moon
# (i85806) and Sun (i86272), which two Concepticon concept sets name and the
# plain edition does not have.
en = ["https://en-word.net/static/english-wordnet-2025-plus.xml.gz"]

# The 28 pivots, by their ISO 639-3 code: Open Multilingual Wordnet 2.0, except
# that Chinese, Japanese, Indonesian and Malay use the newer standalone releases
# Cygnet adopted on 2026-10-24 (COW 1.1, wnja 2.1 and Wordnet Bahasa 1.4).
